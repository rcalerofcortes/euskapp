<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EuskApp - Learn Basque</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- App icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

    <!-- Mobile browser theming -->
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EuskApp">

    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <!-- Main container where screens are rendered -->
    <div id="app"></div>

    <!-- Supabase SDK (must load before app scripts) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- App scripts (defer preserves load order) -->
    <!-- Bump ?v= when you change JS/CSS to bust the browser cache -->
    <script src="js/supabase-client.js?v=4" defer></script>
    <script src="js/storage.js?v=4" defer></script>
    <script src="js/data.js?v=4" defer></script>
    <script src="js/screens/login.js?v=4" defer></script>
    <script src="js/screens/menu.js?v=4" defer></script>
    <script src="js/screens/study.js?v=4" defer></script>
    <script src="js/screens/phrases.js?v=4" defer></script>
    <script src="js/screens/addcontent.js?v=4" defer></script>
    <script src="js/screens/challenges.js?v=4" defer></script>
    <script src="js/screens/statistics.js?v=4" defer></script>
    <script src="js/app.js?v=4" defer></script>
</body>
</html>
